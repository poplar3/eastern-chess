[package]
name = "eastern-chess"
version = "0.5.0"
description = "Восточные шахматы: чанги, сянци, сёги"
authors = ["poplar3"]
license = "GPL-3.0"
repository = "https://github.com/poplar3/eastern-chess"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "janggi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
